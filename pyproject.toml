[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossforge"
version = "0.1.0"
description = "Claude architects while Codex and Grok build in isolated lanes; evidence decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sadiq Jaffer" }
]
keywords = [
  "claude-code",
  "codex",
  "grok",
  "orchestration",
  "worktrees"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = []

[project.urls]
Repository = "https://github.com/Satscryption/Crossforge"

[tool.setuptools]
package-dir = { "" = "skills/crossforge/scripts" }

[tool.setuptools.packages.find]
where = ["skills/crossforge/scripts"]
include = ["crossforge_lib", "crossforge_lib.*"]

[tool.crossforge.release]
canonical-distribution = "claude-marketplace"
plugin-root = "."
wheel-contains-plugin = false
